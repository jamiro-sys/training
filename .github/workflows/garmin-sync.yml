name: Garmin Sync

# Holt Garmin Daten über intervals.icu (ganze Historie beim ersten Lauf) und speichert sie im PRIVATEN Repository jamiro-sys/training-data.
# Secrets: INTERVALS_API_KEY, INTERVALS_ATHLETE_ID, DATA_REPO_TOKEN, optional STRAVA_CLIENT_ID und STRAVA_CLIENT_SECRET (Fine grained token mit Contents Lesen und Schreiben für training-data)

on:
  schedule:
    - cron: "0 11,23 * * *"  # 12:00 und 00:00 Uhr Schweizer Winterzeit (UTC+1)
    - cron: "0 10,22 * * *"  # 12:00 und 00:00 Uhr Schweizer Sommerzeit (UTC+2)
    - cron: "15 5 * * *"     # 06:15 Uhr Winterzeit, frische Nachtwerte fürs Morgenbriefing um 06:40
    - cron: "15 4 * * *"     # 06:15 Uhr Sommerzeit
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/garmin-sync.mjs", ".github/workflows/garmin-sync.yml", "scripts/sync-jetzt.txt"]

permissions:
  contents: read

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Richtige Uhrzeit für die Schweiz?
        if: github.event_name == 'schedule'
        run: |
          off=$(TZ=Europe/Zurich date +%z)
          sch="${{ github.event.schedule }}"
          if [ "$off" = "+0100" ] && [ "$sch" != "0 11,23 * * *" ] && [ "$sch" != "15 5 * * *" ]; then echo "Sommerzeit Lauf im Winter, übersprungen"; echo "SKIP=1" >> $GITHUB_ENV; fi
          if [ "$off" = "+0200" ] && [ "$sch" != "0 10,22 * * *" ] && [ "$sch" != "15 4 * * *" ]; then echo "Winterzeit Lauf im Sommer, übersprungen"; echo "SKIP=1" >> $GITHUB_ENV; fi
      - name: Zugang prüfen
        if: env.SKIP != '1'
        env:
          T: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::error::Secret DATA_REPO_TOKEN fehlt. Siehe README."; exit 1; fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with:
          repository: jamiro-sys/training-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 20
      - name: Daten von intervals.icu holen
        if: env.SKIP != '1'
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          DATA_DIR: private
        run: node scripts/garmin-sync.mjs
      - name: Im privaten Repository speichern
        if: env.SKIP != '1'
        working-directory: private
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nichts zu speichern"; exit 0; fi
          git config user.name "garmin-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garmin.json garmin-history.json profil.json
          [ -f strava-token.json ] && git add strava-token.json
          git commit -m "Update Garmin $(date -u +%F)"
          git pull --rebase -q || true
          git push
